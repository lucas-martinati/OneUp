  <title>OneUp | Stay Consistent</title>
  <style>
    .splash-screen {
      position: fixed;
      inset: 0;
      background: #050505;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
      color: #ffffff;
      z-index: 9999;
    }
    .splash-logo-wrap {
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 30px rgba(109, 40, 217, 0.35);
      animation: splashPulse 2s ease-in-out infinite alternate;
    }
    .splash-logo {
      width: 48px;
      height: 48px;
      object-fit: contain;
      border-radius: 12px;
    }
    .splash-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      background: linear-gradient(135deg, #ffffff 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .splash-bar {
      width: 120px;
      height: 3px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
      margin-top: 6px;
    }
    .splash-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, #6d28d9, #8b5cf6, #0ea5e9);
      border-radius: 3px;
      animation: splashBar 0.75s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes splashPulse {
      0% { transform: scale(1); box-shadow: 0 0 20px rgba(109, 40, 217, 0.2); }
      100% { transform: scale(1.05); box-shadow: 0 0 40px rgba(139, 92, 246, 0.5); }
    }
    @keyframes splashBar {
      0% { left: -45%; }
      100% { left: 100%; }
    }
  </style>
</head>

<body>
  <div id="root">
    <div id="app-skeleton" class="splash-screen">
      <div class="splash-logo-wrap">
        <img src="/logo-64x64.webp" alt="OneUp" class="splash-logo" width="48" height="48" fetchpriority="high">
      </div>
      <div class="splash-title">OneUp</div>
      <div class="splash-bar"></div>
    </div>
  </div>

</body>
